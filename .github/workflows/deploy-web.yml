# Publish the web feed to GitHub Pages on every push to main that touches it.
# Builds web/ and pushes the result to the gh-pages branch, which Pages serves
# at https://torutesu.github.io/Tiktokforwork/ — no repository setting needed.
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
        env:
          VITE_BASE: /Tiktokforwork/
          VITE_API_HOST: tiktokforwork.torubj0904.workers.dev
      - name: Push to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish the web feed from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
